# Kaggle-friendly checkpoint budget guardrails for the small profile.
runtime:
  checkpoint_storage_budget_gb: 4.0
  checkpoint_storage_warning_fraction: 0.8
  checkpoint_storage_cleanup_enabled: true
  checkpoint_storage_cleanup_target_fraction: 0.6

# Canonical small masked-room profile alias. The main validated config now uses
# the same downsized masked-room architecture; this file keeps the storage
# budget guardrails and remains a convenient explicit preset.
masked_room:
  model_channels: 64
  hidden_dim: 48
  unet_channel_mult: [1, 2]
  unet_num_res_blocks: 1
  unet_attention_resolutions: [0, 1]
  unet_num_heads: 4
  min_mask_ratio: 0.0
  max_mask_ratio: 1.0
  logic_net_enabled: false
  alpha_logic: 0.0
