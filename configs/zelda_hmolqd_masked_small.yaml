# Kaggle-friendly checkpoint budget guardrails for the small profile.
config_version: 1

runtime:
  checkpoint_storage_budget_gb: 4.0
  checkpoint_storage_warning_fraction: 0.8
  checkpoint_storage_cleanup_enabled: true
  checkpoint_storage_cleanup_target_fraction: 0.6

# Masked-room G-only (no-LogicNet) ablation preset pairing with the canonical G-LMDM
# profile in configs/zelda_hmolqd.yaml (which sets condition_gnn_type: gps,
# logic_net_enabled: true, alpha_logic: 0.1). Keeps Kaggle storage budget guardrails.
training:
  stage: masked_room

generation:
  room_generator_mode: discrete_masked
  guidance_scale: 3.0
  logic_guidance_scale: 0.0

masked_room:
  model_channels: 64
  hidden_dim: 48
  unet_channel_mult: [1, 2]
  unet_num_res_blocks: 1
  unet_attention_resolutions: [0, 1]
  unet_num_heads: 4
  condition_gnn_type: gps
  condition_use_rrwp_edge_features: true
  condition_use_reference_room_maps: true
  condition_strict_schema: true
  min_mask_ratio: 0.0
  max_mask_ratio: 1.0
  rare_tile_weight: 1.0
  focal_gamma: 0.0
  logic_net_enabled: false
  alpha_logic: 0.0
