# Kaggle-friendly checkpoint budget guardrails for the small profile.
runtime:
  checkpoint_storage_budget_gb: 4.0
  checkpoint_storage_warning_fraction: 0.8
  checkpoint_storage_cleanup_enabled: true
  checkpoint_storage_cleanup_target_fraction: 0.6

# Small masked-room override profile. Unspecified fields inherit from the main
# validated config, including runtime.auto_resume=true and masked_room.keep_last=2.

# Downsized masked-room profile for ablation and efficiency probing
masked_room:
  model_channels: 64
  hidden_dim: 48
  unet_channel_mult: [1, 2]
  unet_num_res_blocks: 1
  unet_attention_resolutions: [0, 1]
  unet_num_heads: 4
  min_mask_ratio: 0.12
  max_mask_ratio: 0.85
