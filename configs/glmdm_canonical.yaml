# Canonical 1-Stage G-LMDM Configuration (Arm: G-LG)
# Graph-Conditioned Logic-Regularized Masked Discrete Model
# Architecture: Block I Mission Grammar + Block III GraphGPS (RRWP + Neighbor Maps)
#             + Block IV DiscreteMaskedRoomModel (<=100K denoiser params, hidden_dim=48 -> 84,764 params)
#             + Block V Frozen Differentiable Bellman-Ford LogicNet (local + global)
#             + Block VI/VII Symbolic Repair & StateSpaceAStar Verification

config_version: 1

training:
  stage: masked_room

runtime:
  experiment_name: glmdm_canonical_g_lg
  output_dir: outputs/glmdm_canonical
  seed: 42
  checkpoint_storage_budget_gb: 4.0
  checkpoint_storage_warning_fraction: 0.8
  checkpoint_storage_cleanup_enabled: true
  checkpoint_storage_cleanup_target_fraction: 0.6

dataset:
  data_dir: Data/The Legend of Zelda
  schema_profile: zelda_v1
  batch_size: 4
  use_vglc: true
  normalize: true
  room_level: true
  dungeon_batch_mode: true
  load_graphs: true
  train_dungeons: [1, 2, 3, 4, 5, 6, 7, 8]
  test_dungeons: [9]
  variants: [1, 2]
  topology_supervision_mode: runtime_aligned

masked_room:
  epochs: 120
  learning_rate: 0.0002
  optimizer_weight_decay: 0.00001
  grad_clip_norm: 1.0
  scheduler_eta_min: 0.000001
  save_every: 10
  keep_last: 2
  validation_fraction: 0.1
  validation_max_batches: 16
  best_checkpoint_metric: val_loss
  model_channels: 64
  hidden_dim: 48
  unet_channel_mult: [1, 2]
  unet_num_res_blocks: 1
  unet_attention_resolutions: [0, 1]
  unet_num_heads: 4
  unet_dropout: 0.1
  context_dim: 96
  condition_hidden_dim: 96
  condition_num_gnn_layers: 2
  condition_num_attention_heads: 4
  condition_dropout: 0.1
  condition_gnn_type: gps
  condition_use_rrwp_edge_features: true
  condition_use_reference_room_maps: true
  condition_strict_schema: true
  graph_conditioning_mode: node_sequence
  use_current_node_distance_features: true
  current_node_distance_max: 8
  masked_steps: 8
  min_mask_ratio: 0.15
  max_mask_ratio: 1.0
  topology_alignment_weight: 0.25
  rare_tile_weight: 2.0
  focal_gamma: 0.0
  attention_mode: softmax
  context_attention_mode: concat_encoder
  topology_conditioning_mode: additive
  logic_net_enabled: true
  logic_net_trainable: false
  alpha_logic: 0.1
  logic_grid_pathfinder: bellman_ford
  logic_graph_pathfinder: dense_bellman_ford
  logic_resource_gate_mode: hard_ordered
  logic_full_coverage: true
  num_logic_iterations: 30
  logic_initial_temperature: 1.0
  logic_final_temperature: 0.05
  logic_topology_trace_weight: 0.1
  logic_topology_anchor_weight: 0.1
  logic_global_reach_weight: 1.0
  logic_global_room_weight: 0.25
  room_topology_channels: 54

generation:
  room_generator_mode: discrete_masked
  num_diffusion_steps: 8
  guidance_scale: 3.0
  logic_guidance_scale: 1.0
  apply_repair: true
  puzzle_room_scaffold_enabled: false
  enable_map_elites: false
  symbolic_max_repair_attempts: 5
  symbolic_repair_margin: 2
  symbolic_adjacency_threshold: 0.01
