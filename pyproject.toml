[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kltn-hmolqd"
version = "0.1.0"
description = "Hybrid masked-diffusion optimization with logical quality diversity for dungeon generation."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torch-geometric>=2.3.0",
    "networkx>=3.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "Pillow>=9.0.0",
    "opencv-python>=4.5.5.64",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "h5py>=3.8.0",
    "pydot>=1.4.2",
    "tqdm>=4.65.0",
    "typing-extensions>=4.5.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
train = [
    "accelerate>=0.20.0",
    "wandb>=0.15.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
