[pytest]
addopts =
    --timeout=60
testpaths =
    tests
    scripts
norecursedirs =
    .git
    .pytest_cache
    .pytest_*
    artifacts
    outputs
    tmp
    tmp*
    pytest_*
markers =
    slow: marks long-running integration/performance tests
    gpu: marks CUDA-only smoke tests for the manual self-hosted GPU workflow
